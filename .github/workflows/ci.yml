name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shadow
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shadow -d shadow"
          --health-interval 3s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Format, lint, type check, and tests
        run: |
          ruff format --check .
          ruff check .
          mypy src
          pytest -q
      - name: PostgreSQL migration and fixture smoke
        env:
          SHAI_DATABASE_URL: postgresql+psycopg://shadow:ci-only-password@localhost:5432/shadow
          SHAI_DEVELOPMENT_MODE: 'true'
          SHAI_AUTH_MODE: dev
          SHAI_RUN_WORKER: 'false'
        run: |
          shadow-ai migrate
          shadow-ai sync
