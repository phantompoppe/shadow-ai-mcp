services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shadow
      POSTGRES_USER: shadow
      POSTGRES_PASSWORD: local-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow -d shadow"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - shadow_pgdata:/var/lib/postgresql/data
  shadow-ai:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
volumes:
  shadow_pgdata:
